<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>YANINDAYIM</title>
<meta name="description" content="YANINDAYIM: 6, 7 ve 8. sınıf öğrencileri için akran zorbalığına tanık olunduğunda güvenli destek yollarını işleyen üç oturumluk etkileşimli dijital psikoeğitim programı. Giriş gerektirmez, veri kaydetmez.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<style>
/* YANINDAYIM — tek (açık) tema; krem zemin, lacivert metin, turkuaz ve yumuşak mor vurgular. Sistem yazı tipleri. */
:root{
  --cream:#FBF6EC; --paper:#FFFDF8; --sand:#F1E8D6; --line:#E2D6BF;
  --ink:#1D2B53; --ink-2:#47527A; --ink-3:#6E7694;
  --teal:#1BA9A0; --teal-ink:#0B746D; --teal-soft:#D3EFEA; --teal-wash:#EEF9F7;
  --lilac:#9B87D9; --lilac-ink:#5A47A3; --lilac-soft:#ECE6FA;
  --peach:#F8DCC8; --peach-ink:#94461F; --warn-bg:#FDF3EE; --warn-line:#E7B8A4; --danger:#A3341F;
  --f-display:"Trebuchet MS",ui-rounded,"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Ubuntu,Arial,sans-serif;
  color-scheme:light;
}
html,body{background:var(--cream);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(40px,7vw,68px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(26px,3.8vw,38px);font-weight:800}
h3{font-size:21px;font-weight:700}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:12px}

/* Üst bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cream);border-bottom:1.5px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink);font:800 23px/1 var(--f-display)}
.brand svg{width:36px;height:36px;flex:none}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.brand{font-size:20px}.brand svg{width:30px;height:30px}}
/* Kabuk */
.shell{max-width:1080px;margin:0 auto;padding-block:24px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:grid;gap:26px}
.enter{animation:enter .28s ease-out both}
@keyframes enter{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.split{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:36px;align-items:center}
.split.top{align-items:start}
@media (max-width:840px){.split{grid-template-columns:minmax(0,1fr);gap:22px}}
.stack{display:grid;gap:16px;min-width:0;align-content:start}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-ink)}
.lead{font-size:clamp(18px,2.1vw,21px);color:var(--ink-2);max-width:36em}
.muted{color:var(--ink-2)}
.small{font-size:14.5px}
.narrow{max-width:720px;margin-inline:auto;width:100%}

.art{border:2.5px solid var(--ink);border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:7px 7px 0 var(--lilac-soft);max-width:100%}
.art svg{display:block;width:100%;height:auto}

/* Düğmeler */
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:800 17px/1.1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:15px;border:2.5px solid var(--ink);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 2px 0 var(--ink)}
.btn-primary{background:var(--ink);color:var(--paper);box-shadow:0 4px 0 var(--teal)}
.btn-primary:hover{box-shadow:0 5px 0 var(--teal)}
.btn-primary:active{box-shadow:0 1px 0 var(--teal)}
.btn-text{background:none;border:0;box-shadow:none;padding:0 6px;color:var(--ink-2);text-decoration:underline;text-underline-offset:4px;min-height:44px}
.btn-text:hover,.btn-text:active{box-shadow:none;transform:none;color:var(--ink)}
.btn svg{width:20px;height:20px}

/* Bilgi kutuları */
.note{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;background:var(--lilac-soft);border-radius:18px;padding:14px 16px;color:var(--ink);font-size:15.5px}
.note svg{width:28px;height:28px}
.note.teal{background:var(--teal-wash);border:1.5px solid var(--teal-soft)}
.note.warn{background:var(--warn-bg);border:1.5px solid var(--warn-line)}
.note b{font-weight:800}
.note ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--sand);color:var(--ink-2)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.hero-title{display:grid;gap:10px}
.hero-title h1 span{color:var(--teal-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--sand);color:var(--ink-2);justify-self:start}
.chip svg{width:14px;height:14px}
.chip.teal{background:var(--teal-soft);color:var(--teal-ink)}
.chip.lilac{background:var(--lilac-soft);color:var(--lilac-ink)}
.chip.warn{background:var(--warn-bg);color:var(--peach-ink)}

/* Adım çizgisi (akış) */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--sand);color:var(--ink-3);display:inline-flex;gap:5px;align-items:center}
.step.on{background:var(--ink);color:var(--paper)}
.step.ok{background:var(--teal-soft);color:var(--teal-ink)}
.step svg{width:14px;height:14px}

/* Eğitim kartları */
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots i{width:28px;height:8px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--teal)}
.facts{display:grid;gap:10px;list-style:none;padding:0;margin:0}
.facts li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700}
.facts .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft)}
.facts li:nth-child(2) .ic{background:var(--lilac-soft)}
.facts li:nth-child(3) .ic{background:var(--peach)}
.facts .ic svg{width:22px;height:22px}

/* Etkinlikler */
.act{display:grid;gap:18px}
.act-item{background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;padding:18px;display:grid;gap:14px}
.act-item .q{font-weight:800;font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{font:800 16px/1.25 var(--f-body);text-align:left;padding:12px 16px;min-height:52px;border-radius:14px;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.opt:hover{background:var(--teal-wash)}
.opt[aria-pressed="true"]{background:var(--lilac-soft);box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.opt.sugg{border-color:var(--teal-ink)}
.explain{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;background:var(--teal-wash);border-radius:14px;padding:12px 14px;font-size:16px}
.explain svg{width:22px;height:22px}
.explain b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-ink)}
.flip{perspective:900px;border:0;background:none;padding:0;cursor:pointer;text-align:left;width:100%}
.flip-in{display:grid;min-height:130px;border:2.5px solid var(--ink);border-radius:20px;padding:18px;box-shadow:0 4px 0 var(--ink);background:var(--paper);font:800 18px/1.35 var(--f-body);color:var(--ink);align-content:center;gap:6px}
.flip.open .flip-in{background:var(--teal-wash)}
.flip small{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.flips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.flips{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{font:800 15px var(--f-body);padding:10px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;min-height:44px}
.chipbtn[aria-pressed="true"]{background:var(--lilac-soft)}
.script{background:var(--paper);border:2px dashed var(--lilac);border-radius:18px;padding:16px 18px;display:grid;gap:6px;font-size:16.5px}

/* Senaryo */
.scene-text{display:grid;gap:12px;font-size:18px}
.speech{background:var(--paper);border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;justify-self:start;max-width:100%}
.question{font:800 23px/1.2 var(--f-display);color:var(--ink);display:flex;align-items:center;gap:10px}
.question::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--teal);flex:none}
.choices{display:grid;gap:12px}
.choice{display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;align-items:center;text-align:left;width:100%;padding:14px 18px 14px 14px;min-height:78px;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);font:700 18px/1.35 var(--f-body);color:var(--ink);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
.choice:hover{background:var(--teal-wash);transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice .key{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);font:800 22px/1 var(--f-display);border:2.5px solid var(--ink)}
.choice:nth-child(2) .key{background:var(--lilac-soft)}
.choice:nth-child(3) .key{background:var(--peach)}
.choice.picked{background:var(--teal-soft);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.prev{display:inline-flex;gap:8px;align-items:baseline;font-size:14.5px;color:var(--ink-2);background:var(--sand);padding:6px 12px;border-radius:12px;justify-self:start}
.prev b{color:var(--ink)}
.sc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.sc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.sc-grid{grid-template-columns:minmax(0,1fr)}}
.sc-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;box-shadow:0 4px 0 var(--ink)}
.sc-card .art{border:0;border-bottom:2.5px solid var(--ink);border-radius:0;box-shadow:none}
.sc-card .body{padding:14px 16px;display:grid;gap:8px;align-content:start}
.sc-card h3{font-size:19px}
.sc-card .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:4px}

/* Geri bildirim */
.fb{background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;padding:clamp(18px,3vw,30px);display:grid;gap:20px}
.fb-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tone{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:7px 14px;border-radius:999px}
.tone i{width:10px;height:10px;border-radius:50%}
.tone.t{background:var(--teal-soft);color:var(--teal-ink)} .tone.t i{background:var(--teal)}
.tone.l{background:var(--lilac-soft);color:var(--lilac-ink)} .tone.l i{background:var(--lilac)}
.tone.p{background:var(--peach);color:var(--peach-ink)} .tone.p i{background:#E0874F}
.fb-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:680px){.fb-cols{grid-template-columns:minmax(0,1fr)}}
.col{border-radius:18px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.col.a{background:var(--teal-wash)}
.col.b{background:#FDF3EA}
.col h3{font-size:18px;display:flex;align-items:center;gap:8px}
.col h3 svg{width:22px;height:22px}
.col ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.col li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:baseline;font-size:16.5px}
.col li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--teal);transform:translateY(-1px)}
.col.b li::before{background:#E0874F}
.nextstep{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;background:var(--lilac-soft);border-radius:18px;padding:14px 18px}
.nextstep .ic{width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;border:2px solid var(--lilac)}
.nextstep .ic svg{width:24px;height:24px}
.nextstep b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac-ink)}
.safety{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;background:var(--teal-wash);border:2px solid var(--teal);border-radius:18px;padding:14px 16px;font-weight:700}
.safety svg{width:30px;height:30px}
.caveat{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);border-top:1.5px dashed var(--line);padding-top:14px}
.caveat svg{width:20px;height:20px;flex:none;margin-top:2px}
.pathsum{display:grid;gap:8px;background:var(--sand);border-radius:18px;padding:16px 18px}
.pathsum div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;font-size:16px}
.pathsum span{font-weight:800;color:var(--ink-2);font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}

/* Tamamlama */
.done-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.done-head svg.badge{width:clamp(120px,18vw,170px);height:auto}
@media (max-width:620px){.done-head{grid-template-columns:minmax(0,1fr);justify-items:start}}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.cards3{grid-template-columns:minmax(0,1fr)}}
.take{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:18px;display:grid;gap:8px;align-content:start}
.take .n{font:800 15px var(--f-display);color:var(--teal-ink)}
.take p{font-weight:700;font-size:16.5px}
.donelist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.donelist li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;font-size:16px}
.donelist li svg{width:22px;height:22px;color:var(--teal-ink)}
.donelist li.no svg{color:var(--ink-3)}
.donelist li small{color:var(--ink-3);font-weight:700}
.adults{display:flex;flex-wrap:wrap;gap:8px}
.adults span{background:var(--teal-soft);color:var(--teal-ink);font-weight:800;padding:8px 14px;border-radius:999px;font-size:15px}

/* Alt bilgi */
.foot{max-width:1080px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 14px}
.foot b{color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);font-weight:800;padding:12px 18px;border-radius:14px;font-size:15px;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ───────── 3 oturumluk sürüm ───────── */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.stack.tight{gap:10px}
.sec-title{font-size:clamp(24px,3vw,30px)}
.lead.strong{color:var(--ink)}
.topbar-in{flex-wrap:wrap}
#ses-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.ses-label{font-weight:800;font-size:14px;color:var(--ink-2)}
.topbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 14px;font:800 14px var(--f-body);color:var(--ink);cursor:pointer}
.topbtn svg{width:16px;height:16px}
@media (max-width:560px){.ses-label{display:none}.topbtn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.topbtn{padding:4px 10px}}
/* Ana sayfa oturum kartları */
.ses-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:920px){.ses-grid{grid-template-columns:minmax(0,1fr)}}
.ses-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;padding:18px 20px;display:grid;gap:12px;box-shadow:0 4px 0 var(--ink);align-content:start}
.ses-top{display:flex;gap:14px;align-items:center}
.ses-no{width:52px;height:52px;flex:none;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font:800 24px/1 var(--f-display);background:var(--teal);color:var(--paper)}
.ses-card:nth-child(2) .ses-no{background:var(--lilac)}
.ses-card:nth-child(3) .ses-no{background:var(--ink)}
.ses-ad{font-size:26px}
.ses-list{margin:0;padding:0 0 0 18px;display:grid;gap:4px;font-size:15.5px;color:var(--ink-2)}
.ses-list b{color:var(--ink)}
.ses-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:4px}
/* Adım göstergesi */
.flowwrap{display:grid;gap:6px}
.flow{list-style:none;margin:0;padding:0}
.step .num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:rgba(29,43,83,.08);font-size:11.5px}
.step.on .num{background:rgba(255,255,255,.2)}
.flow-sub{font-size:13.5px;font-weight:700;color:var(--ink-2)}
/* Açılış */
.plan{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:p}
.plan li{display:flex;justify-content:space-between;gap:12px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:9px 14px;font-weight:700;counter-increment:p}
.plan li span:first-child::before{content:counter(p) ". ";color:var(--teal-ink)}
.plan .dk{color:var(--ink-2);font-weight:600;font-size:14.5px;white-space:nowrap}
.rules{margin:0;padding-left:20px;display:grid;gap:6px;font-size:16px}
.opts.col{flex-direction:column;align-items:stretch}
.opts.col .opt{width:100%}
/* Onun gözünden */
.inner{margin:0;background:var(--paper);border:2.5px solid var(--ink);border-left:10px solid var(--lilac);border-radius:20px;padding:20px 22px;display:grid;gap:10px;font-size:18px;line-height:1.6}
.inner footer{font-weight:800;color:var(--lilac-ink)}
/* Ne derdim? */
.field{display:grid;gap:8px}
.field label{font-weight:800}
.ta{width:100%;font:600 16.5px/1.5 var(--f-body);padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--cream);color:var(--ink);resize:vertical}
.ta:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.btn.small{min-height:44px;padding:0 16px;font-size:15px}
.fbline{display:grid;gap:8px;background:var(--cream);border-radius:14px;padding:12px 14px}
.fbline .tone{justify-self:start}
.tight-list{margin:6px 0;padding-left:18px;display:grid;gap:2px}
p.note{align-items:center}
/* Ne yapardım? — kurgusal telefon */
.phone{max-width:380px;margin-inline:auto;background:var(--ink);border-radius:34px;padding:12px}
.phone-in{background:var(--paper);border-radius:24px;overflow:hidden;min-height:340px}
.phone-top{background:var(--teal);color:var(--paper);font-weight:800;text-align:center;padding:12px 14px;font-size:16px}
.chat{list-style:none;margin:0;padding:14px;display:grid;gap:10px}
.msg{background:var(--lilac-soft);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:15.5px;justify-self:start;max-width:92%}
.msg .who{font-weight:800;color:var(--lilac-ink)}
.msg.me{background:var(--teal-soft);border-radius:16px 16px 4px 16px;justify-self:end}
.msg.me .who{color:var(--teal-ink)}
.msg.sys{background:var(--sand);border:1.5px dashed var(--ink-3);border-radius:12px;justify-self:center;font-size:14px;font-weight:700;color:var(--ink-2);text-align:center}
.poll{display:grid;gap:6px;margin-top:6px;min-width:190px}
.poll-row{display:flex;justify-content:space-between;gap:10px;background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:5px 10px;font-weight:700}
.react{justify-self:start;background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-weight:800}
.nyopts{display:grid;gap:10px}
.nyopt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;min-height:68px;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 var(--ink);font:700 16px/1.3 var(--f-body);color:var(--ink);cursor:pointer}
.nyopt:hover{background:var(--teal-wash)}
.nyopt[aria-pressed="true"]{background:var(--lilac-soft);box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.nyopt small{display:block;font-weight:600;font-size:14px;color:var(--ink-2)}
.nyic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sand);border:2px solid var(--ink);font-size:20px}
.fb.small-fb{gap:12px;padding:18px}
.fb.small-fb h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:460px){.nyopt{grid-template-columns:40px minmax(0,1fr)}.nyopt .chip{grid-column:2}}
/* Onay paneli */
.confirm{display:grid;gap:10px;padding:16px 18px;border-radius:18px;border:2.5px solid var(--warn-line);background:var(--warn-bg);margin-bottom:22px}
/* Kapanış */
.nextses{display:grid;gap:4px;background:var(--lilac-soft);border-radius:18px;padding:14px 18px}
.nextses b{font:800 24px/1.2 var(--f-display);color:var(--ink)}
.tone i{flex:none}

</style>
</head>

          return '<button type="button" class="chipbtn" aria-pressed="' + (secili.indexOf(si) >= 0) + '" data-act="coklu" data-a="' + anahtar + '" data-p="' + pi + '" data-s="' + si + '" data-k="ck' + si + '">' + esc(s) + "</button>";
        }).join("") + '</div><div role="status" aria-live="polite">' + (d.goster ? '<div class="explain">' + I.bulb + "<div><b>Birlikte düşünelim</b>" + esc(p.yanit) + "</div></div>"
          : '<div class="btns"><button class="btn" data-act="coklu-goster" data-a="' + anahtar + '" data-p="' + pi + '" data-k="ckg"' + (secili.length ? "" : " disabled") + ">Seçtim</button></div>") + "</div></div>";
      } else if (p.tip === "kartcevir") {

          return '<button type="button" class="flip' + (acik ? " open" : "") + '" aria-expanded="' + acik + '" data-act="cevir" data-a="' + anahtar + '" data-p="' + pi + '" data-o="' + og.id + '" data-k="cv' + og.id + '"><span class="flip-in"><small>' + (acik ? "Yardımcı düşünce" : "Durduran düşünce · çevirmek için dokun") + "</small>" + esc(acik ? og.arka : og.on) + "</span></button>";

      } else if (p.tip === "plan") {

        }).join("") + '</div><div class="script"><b>Söyleyebileceklerim</b>' + p.sablon.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("") + "</div>" +
          '<p class="muted small">' + esc(p.not) + "</p></div>";
      }
      return '<div class="act">' + h + "</div>";
    }).join("");
    var plan = e.k === "plan";
    return '<section class="screen">' + adimSeridi(o, e) + '<div class="narrow stack">' +
      '<p class="eyebrow">Oturum ' + o.no + " · " + (plan ? "Kapanış" : "Öğren · Etkinlik") + "</p><h2 tabindex=\"-1\">" + esc(E.baslik) + "</h2>" +
      (E.yonerge ? '<p class="lead">' + esc(E.yonerge) + "</p>" : "") + parts + gezinme() + "</div></section>";
  }

  /* ───────── Yeni etkinlik 1: Onun gözünden ───────── */

      '<p class="muted small">' + esc(y.not) + "</p>" + '<div class="btns"><button class="btn btn-primary" data-act="ileri" data-k="ileri">Devam' + I.arrow + "</button></div></div></div></section>";

  /* ───────── Yeni etkinlik 2: Ne derdim? ───────── */

        '<div class="btns"><button type="button" class="btn small" data-act="nd-yazi" data-d="' + d.id + '" data-k="ndy' + d.id + '">Cümlemi düşün</button></div>' +
        '<div id="ndg-' + d.id + '" role="status" aria-live="polite"></div></div></section>';

  function ndGenel() {

      "</ul>Cümleni bu özelliklere göre bir kez daha okuyabilirsin. Yazdığın cümle değerlendirilmez, kaydedilmez ve bu ekrandan ayrılınca silinir.</div></div>";
  }

  /* ───────── Yeni etkinlik 3: Ne yapardım? (kurgusal sohbet) ───────── */
  function nyTelefon(y) {
    var sec = S.ny.secili ? y.secenekler.filter(function (s) { return s.id === S.ny.secili; })[0] : null;
    var msj = y.mesajlar.map(function (m) {
      if (m.anket) {
        return '<li class="msg"><span class="who">' + esc(m.kim) + ':</span><div class="poll"><span class="sr">Anket seçenekleri: </span>' + m.anket.map(function (a) { return '<span class="poll-row"><span>' + esc(a[0]) + '</span><span>' + a[1] + " oy</span></span>"; }).join("") +
          (sec && sec.id === "emoji" ? '<span class="react" aria-label="Senin tepkin: gülen yüz">😂 1</span>' : "") + "</div></li>";
      }
      return '<li class="msg"><span class="who">' + esc(m.kim) + ":</span> " + esc(m.metin) + "</li>";
    }).join("");
    if (sec && sec.id !== "emoji") msj += '<li class="msg sys">' + esc(sec.sistem) + "</li>";
    if (sec && sec.id === "emoji") msj += '<li class="msg sys">' + esc(sec.sistem) + "</li>";
    var ozel = sec && sec.id === "ozel";
    return '<div class="phone" role="region" aria-label="Kurgusal mesajlaşma ekranı"><div class="phone-in"><p class="phone-top">' + (ozel ? "Ece · özel mesaj" : esc(y.grupAdi) + " (kurgusal)") + "</p>" +
      (ozel ? '<ol class="chat"><li class="msg me"><span class="who">Sen:</span> Anketi gördüm, hiç hoş değil. Yanındayım. İstersen birlikte bir öğretmene anlatalım.</li><li class="msg sys">' + esc(sec.sistem) + "</li></ol>"

  function nySonuc(y) {

      '<span class="tone ' + sec.ton + '"><i aria-hidden="true"></i>' + esc(sec.etiket) + "</span></div>" +

  }
  function vNeYapardim(o, e) {
    var y = YENI["ne-yapardim"];

      var gor = !!S.ny.gorulen[s.id];
      return '<button type="button" class="nyopt" aria-pressed="' + (S.ny.secili === s.id) + '" data-act="ny" data-s="' + s.id + '" data-k="ny' + s.id + '"><span class="nyic" aria-hidden="true">' + s.ikon + '</span><span><b>' + esc(s.t) + "</b><small>" + esc(s.aciklama) + "</small></span>" +
        (S.ny.ilk === s.id ? '<span class="chip">İlk seçimin</span>' : gor ? '<span class="chip teal">İncelendi</span>' : "") + "</button>";
    }).join("");
    var kalan = y.secenekler.length - Object.keys(S.ny.gorulen).length;
    return '<section class="screen">' + adimSeridi(o, e) + '<div class="stack"><p class="eyebrow">Oturum ' + o.no + " · Etkinlik</p><h2 tabindex=\"-1\">" + esc(y.baslik) + '</h2><p class="lead">' + esc(y.giris) + "</p>" +
      '<p class="note teal">' + I.shield + "<span>" + esc(y.simulasyon) + "</span></p>" +
      '<div class="split top"><div>' + nyTelefon(y) + '</div><div class="stack"><h3 id="ny-q">Bu mesajı gördün. Ne yapardın?</h3><div class="nyopts" role="group" aria-labelledby="ny-q">' + secenekler + "</div>" +
      (S.ny.ilk ? '<p class="muted small">' + (kalan > 0 ? "Diğer seçeneklere de dokunup sonuçlarını inceleyebilirsin." : "Tüm seçenekleri inceledin.") + "</p>" : "") +
      '<div role="status" aria-live="polite">' + nySonuc(y) + "</div></div></div>" +
      '<p class="caveat">' + I.info + "<span>Bunlar olası sonuçlardır. Gerçek hayatta her durum farklı gelişebilir; hiçbir seçim kesin bir sonucu garanti etmez.</span></p>" + gezinme() + "</div></section>";
  }

  /* ───────── Senaryolar ───────── */
  function sDurum(sid) { return S.senaryo[sid] || (S.senaryo[sid] = { yol: [] }); }
  function mevcut(sc) { var st = sDurum(sc.id); return st.yol.length ? st.yol[st.yol.length - 1].hedef : sc.baslangic; }
  function secimMetni(sc, dug, k) { var d = sc.d[dug]; var x = d && d.secenekler && d.secenekler.filter(function (z) { return z.k === k; })[0]; return x ? x.t : ""; }
  function vSenaryo(o, e) {
    var sc = e.s, did = mevcut(sc), d = sc.d[did], st = sDurum(sc.id);
    var bas = '<p class="eyebrow">Senaryo ' + (e.k + 1) + "/2 · " + esc(sc.ad) + "</p>";
    if (d.tip === "karar") {
      var onceki = st.yol.length ? st.yol[st.yol.length - 1] : null;

        '<div class="stack">' + bas + '<p class="chip lilac">Karar ' + d.adim + " / 2</p>" +
        (onceki ? '<p class="prev">Önceki seçimin: <b>' + esc(onceki.secim) + "</b>&nbsp;· " + esc(secimMetni(sc, onceki.dugum, onceki.secim)) + "</p>" : "") +
        "<h2 tabindex=\"-1\">" + esc(d.baslik) + '</h2><p class="muted small">' + esc(d.yer) + "</p>" +
        '<div class="scene-text">' + d.metin.map(function (p, i) { return i === d.konusma ? '<p class="speech">' + esc(p) + "</p>" : "<p>" + esc(p) + "</p>"; }).join("") + "</div>" +
        '<p class="question" id="q-' + did + '">' + esc(d.soru) + "</p>" +
        '<div class="choices" role="group" aria-labelledby="q-' + did + '">' + d.secenekler.map(function (x) {
          return '<button class="choice" data-act="sec" data-sid="' + sc.id + '" data-dug="' + did + '" data-s="' + x.k + '" data-k="ch' + x.k + '"><span class="key" aria-hidden="true">' + x.k + '</span><span><span class="sr">Seçenek ' + x.k + ": </span>" + esc(x.t) + "</span></button>";
        }).join("") + "</div>" +
        '<div class="btns">' + (onceki ? '<button class="btn" data-act="s-geri" data-sid="' + sc.id + '" data-k="sgeri">' + I.back + "Önceki karara dön</button>"
          : (S.i > 0 ? '<button class="btn" data-act="geri" data-k="geri">' + I.back + "Geri</button>" : "")) + "</div></div></div></section>";
    }
    return '<section class="screen">' + adimSeridi(o, e) + '<div class="split">' + sahne(d.sahne) +
      '<div class="stack">' + bas + '<p class="eyebrow">Sonra ne oldu?</p>' +
      '<div class="pathsum">' + st.yol.map(function (y, i) { return "<div><span>Karar " + (i + 1) + "</span><p>" + esc(secimMetni(sc, y.dugum, y.secim)) + "</p></div>"; }).join("") + "</div>" +
      '<p class="lead strong">' + esc(d.hikaye) + "</p></div></div>" +
      '<div class="fb"><div class="fb-head"><h2 tabindex="-1">Bu seçimlerin olası etkileri</h2><span class="tone ' + d.ton + '"><i aria-hidden="true"></i>' + esc(d.etiket) + "</span></div>" +
      (d.guvenlik ? '<div class="safety">' + I.shield + "<div>" + esc(d.guvenlik) + "</div></div>" : "") +
      '<div class="fb-cols"><div class="col a"><h3>' + I.sprout + "Neyi sağlayabilir?</h3><ul>" + d.arti.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>" +
      '<div class="col b"><h3>' + I.eye + "Neye dikkat etmek gerekebilir?</h3><ul>" + d.dikkat.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div></div>" +
      '<div class="nextstep"><span class="ic">' + I.hand + "</span><div><b>Bir sonraki adım için</b>" + esc(d.sonraki) + "</div></div>" +
      '<p class="caveat">' + I.info + "<span>Bu, olası sonuçlardan yalnızca biri. Gerçek hayatta her durum farklı gelişebilir; hiçbir seçim kesin bir sonucu garanti etmez.</span></p></div>" +
      '<div class="btns"><button class="btn" data-act="s-geri" data-sid="' + sc.id + '" data-k="sgeri">' + I.back + "Önceki karara dön</button>" +
      '<button class="btn" data-act="s-tekrar" data-sid="' + sc.id + '" data-k="stekrar">' + I.repeat + "Farklı bir seçim dene</button>" +
      '<button class="btn btn-primary" data-act="ileri" data-k="ileri">' + (e.k === 0 ? "Sonraki senaryoya geç" : "Kapanışa geç") + I.arrow + "</button></div></section>";
  }

  /* ───────── Kapanış ───────── */
  function vKapanis(o, e) {
    var son = o.no === 3;
    return '<section class="screen">' + adimSeridi(o, e) + '<div class="done-head">' + rozet() +
      '<div class="stack"><p class="eyebrow">Oturum ' + o.no + " · Kapanış</p><h2 tabindex=\"-1\">Bu oturumu bitirdin</h2>" +
      (son ? '<p class="lead strong">Harekete geç oturumunu tamamladın. Bu oturumda, okulda ve internette güvenli destek yollarını uygulamayı düşündük.</p>'
        : '<p class="lead">“' + esc(o.ad) + "” oturumunda konuştuklarımızdan akılda kalsın:</p>") + "</div></div>" +
      '<div class="cards3">' + o.ozet.map(function (t, i) { return '<div class="take"><span class="n">' + (i + 1) + "</span><p>" + esc(t) + "</p></div>"; }).join("") + "</div>" +
      (o.sonraki ? '<div class="nextses"><span class="eyebrow">Sonraki oturum</span><b>' + esc(o.sonraki) + '</b><span class="muted small">Sonraki oturum, araştırmacı ve psikolojik danışmanınla birlikte başlatılacak.</span></div>' : "") +
      '<div class="stack tight"><h3>Okulda kime anlatabilirsin?</h3><div class="adults"><span>Sınıf öğretmenin</span><span>Rehber öğretmen</span><span>Nöbetçi öğretmen</span><span>Okul idaresi</span><span>Ailen</span></div></div>' +
      not("teal", "<b>Kendini ya da bir arkadaşını güvende hissetmiyorsan</b> hemen güvendiğin bir yetişkine söyle. Okul dışında acil tehlike varsa 112 aranabilir.") +
      '<div class="btns">' + '<button class="btn" data-act="geri" data-k="geri">' + I.back + "Geri</button>" +
      '<button class="btn btn-primary" data-act="bitir" data-k="bitir">' + I.home + "Ana sayfaya dön</button></div></section>";
  }
  function rozet() {
    return '<svg class="badge" viewBox="0 0 200 220" role="img" aria-label="Oturum rozeti: iki öğrenci yan yana gülümsüyor"><defs><clipPath id="bclip"><circle cx="100" cy="96" r="68"/></clipPath></defs>' +
      '<path d="M64 150 L50 214 L76 200 L90 220 L100 160Z" fill="#A995E2" ' + ART.ST + '/><path d="M136 150 L150 214 L124 200 L110 220 L100 160Z" fill="#A995E2" ' + ART.ST + "/>" +
      '<circle cx="100" cy="96" r="88" fill="#1BA9A0" ' + ART.ST + '/><circle cx="100" cy="96" r="76" fill="none" stroke="#FFFDF8" stroke-width="3" stroke-dasharray="6 8"/>' +
      '<circle cx="100" cy="96" r="68" fill="#CFEDE8" ' + ART.ST + '/><g clip-path="url(#bclip)">' +
      ART.kid(Object.assign({}, ART.CH.sen, { x: 78, y: 186, s: .82, mood: "happy", showTag: false })) + ART.kid(Object.assign({}, ART.CH.defne, { x: 124, y: 186, s: .82, mood: "happy", showTag: false })) + "</g></svg>";
  }

  /* ───────── Onay paneli (ana sayfa / yeniden başlat) ───────── */
  function vOnay() {
    if (!S.onay) return "";
    var ana = S.onay === "ana";
    return '<div class="confirm" role="alertdialog" aria-labelledby="cf-t" aria-describedby="cf-d"><p id="cf-t"><b>' + (ana ? "Ana sayfaya dönülsün mü?" : "Oturum yeniden başlatılsın mı?") + '</b></p>' +
      '<p id="cf-d">' + (ana ? "Bu oturumdaki seçimler ve yazılar silinir." : "Bu oturumdaki seçimler ve yazılar silinir, oturum baştan başlar.") + '</p><div class="btns">' +
      '<button class="btn btn-primary" data-act="' + (ana ? "ana-evet" : "yeniden-evet") + '" data-k="cf-evet">' + (ana ? "Evet, ana sayfaya dön" : "Evet, yeniden başlat") + '</button><button class="btn" data-act="onay-hayir" data-k="cf-hayir">Vazgeç</button></div></div>';
  }

  /* ───────── Çizim ───────── */
  function ciz(yerinde) {
    var odak = yerinde && document.activeElement && document.activeElement.getAttribute ? document.activeElement.getAttribute("data-k") : null;
    var h;
    if (S.ekran === "ana") h = vAna();
    else {
      var o = oturum(), l = ekranlar(o), e = l[Math.max(0, Math.min(S.i, l.length - 1))];
      if (e.tip === "acilis") h = vAcilis(o, e);
      else if (e.tip === "kart") h = vKart(o, e);
      else if (e.tip === "etkinlik") h = vEtkinlik(o, e);
      else if (e.tip === "yeni") h = e.id === "onun-gozunden" ? vOnunGozunden(o, e) : e.id === "ne-derdim" ? vNeDerdim(o, e) : vNeYapardim(o, e);
      else if (e.tip === "senaryo") h = vSenaryo(o, e);
      else h = vKapanis(o, e);
    }
    app.innerHTML = vOnay() + h;
    ustBar();
    if (yerinde) {
      var el = odak && app.querySelector('[data-k="' + odak + '"]');
      if (el) el.focus({ preventScroll: true });
    } else {
      window.scrollTo(0, 0);
      var bas = S.onay ? app.querySelector('[data-k="cf-hayir"]') : app.querySelector("[tabindex='-1']");
      if (bas && ilkCizimBitti) { try { bas.focus({ preventScroll: true }); } catch (x) {} }
    }
    if (S.onay && yerinde) { var cf = app.querySelector('[data-k="cf-hayir"]'); if (cf && !odak) cf.focus(); }
    ilkCizimBitti = true;
  }
  var ilkCizimBitti = false;
  function ustBar() {
    var oturumda = S.ekran !== "ana";
    var t = document.getElementById("ses-tools");
    t.innerHTML = oturumda ? '<span class="ses-label">Oturum ' + S.oturum + " · " + esc(oturum().ad) + "</span>" +
      '<button class="topbtn" data-act="ana" data-k="top-ana">' + I.home + '<span>Ana sayfa</span></button>' +
      '<button class="topbtn" data-act="yeniden" data-k="top-yeniden">' + I.repeat + '<span>Yeniden başlat</span></button>' : "";
  }
  function git(i) { S.i = i; S.onay = null; yazilar = {}; ciz(false); }
  function anaSayfa() { temizle(); ciz(false); }
  function baslat(n) { temizle(); S.ekran = "oturum"; S.oturum = n; S.i = 0; ciz(false); }

  /* ───────── Olaylar ───────── */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]"); if (!t || t.disabled) return;
    var a = t.getAttribute("data-act"), o = S.oturum ? oturum() : null;
    if (a === "baslat") return baslat(+t.getAttribute("data-n"));
    if (a === "marka") { if (S.ekran === "ana") return; S.onay = "ana"; return ciz(false); }
    if (a === "ana") { S.onay = "ana"; return ciz(false); }
    if (a === "yeniden") { S.onay = "yeniden"; return ciz(false); }
    if (a === "onay-hayir") { S.onay = null; return ciz(false); }
    if (a === "ana-evet" || a === "bitir") return anaSayfa();
    if (a === "yeniden-evet") return baslat(S.oturum);
    if (a === "ileri") return git(Math.min(S.i + 1, ekranlar(o).length - 1));
    if (a === "geri") return git(Math.max(0, S.i - 1));
    if (a === "hat") { S.hat[+t.getAttribute("data-q")] = +t.getAttribute("data-s"); return ciz(true); }
    if (a === "etk") { var k = t.getAttribute("data-a"), p = t.getAttribute("data-p"); S.etk[k] = S.etk[k] || {}; S.etk[k][p] = S.etk[k][p] || {}; S.etk[k][p][t.getAttribute("data-o")] = t.getAttribute("data-s"); return ciz(true); }
    if (a === "coklu") {
      var k2 = t.getAttribute("data-a"), p2 = t.getAttribute("data-p"); S.etk[k2] = S.etk[k2] || {}; var d2 = S.etk[k2][p2] = S.etk[k2][p2] || {}; d2.secili = d2.secili || [];
      var ix = +t.getAttribute("data-s"), pos = d2.secili.indexOf(ix); if (pos >= 0) d2.secili.splice(pos, 1); else d2.secili.push(ix); return ciz(true);
    }
    if (a === "coklu-goster") { var k3 = t.getAttribute("data-a"), p3 = t.getAttribute("data-p"); S.etk[k3][p3].goster = true; return ciz(true); }
    if (a === "cevir") { var k4 = t.getAttribute("data-a"), p4 = t.getAttribute("data-p"); S.etk[k4] = S.etk[k4] || {}; S.etk[k4][p4] = S.etk[k4][p4] || {}; S.etk[k4][p4][t.getAttribute("data-o")] = true; return ciz(true); }
    if (a === "plan") { var si = +t.getAttribute("data-s"); S.plan[si] = !S.plan[si]; return ciz(true); }
    if (a === "nd") {
      /* Yalnızca ilgili bloğu güncelle: yazı alanları silinmez. */
      var did = t.getAttribute("data-d"); S.nd[did] = +t.getAttribute("data-s");
      var d = YENI["ne-derdim"].durumlar.filter(function (x) { return x.id === did; })[0];
      document.getElementById("ndb-" + did).innerHTML = ndBlok(d);
      var yeni = document.querySelector('[data-k="nd' + did + S.nd[did] + '"]'); if (yeni) yeni.focus({ preventScroll: true });
      return;
    }
    if (a === "nd-yazi") { var dd = t.getAttribute("data-d"); document.getElementById("ndg-" + dd).innerHTML = ndGenel(); return; }
    if (a === "ny") { var s = t.getAttribute("data-s"); if (!S.ny.ilk) S.ny.ilk = s; S.ny.secili = s; S.ny.gorulen[s] = true; return ciz(true); }
    if (a === "sec") {
      var sid = t.getAttribute("data-sid"), dug = t.getAttribute("data-dug"), sk = t.getAttribute("data-s");
      var sc = ekranlar(o)[S.i].s; if (!sc || sc.id !== sid || mevcut(sc) !== dug) return;
      var x = sc.d[dug].secenekler.filter(function (z) { return z.k === sk; })[0]; if (!x) return;
      t.classList.add("picked"); app.querySelectorAll(".choice").forEach(function (c) { c.disabled = true; });
      var az = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      setTimeout(function () { sDurum(sid).yol.push({ dugum: dug, secim: sk, hedef: x.hedef }); ciz(false); }, az ? 0 : 220);
      return;
    }
    if (a === "s-geri") { var st = sDurum(t.getAttribute("data-sid")); if (st.yol.length) st.yol.pop(); return ciz(false); }
    if (a === "s-tekrar") { sDurum(t.getAttribute("data-sid")).yol = []; return ciz(false); }
  });
  document.addEventListener("input", function (ev) {
    var id = ev.target.getAttribute && ev.target.getAttribute("data-yazi");
    if (id) yazilar[id] = ev.target.value; /* yalnızca bellekte; ekrandan ayrılınca silinir */
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && S.onay) { S.onay = null; ciz(false); } });

  /* Eski sürümlerin sahne bağlantıları (#...) siteyi bozmadan ana sayfaya döner; URL'ye hiçbir şey yazılmaz. */
  function adresiTemizle() { if (location.hash) { try { history.replaceState(null, "", location.pathname + location.search); } catch (x) {} } }
  window.addEventListener("hashchange", function () { adresiTemizle(); anaSayfa(); });
  /* Tarayıcı geri/ileri önbelleğinden dönüşte önceki öğrencinin seçimleri ve yazıları görünmesin. */
  window.addEventListener("pageshow", function (ev) { if (ev.persisted) { adresiTemizle(); anaSayfa(); } });
  window.addEventListener("pagehide", function () { temizle(); app.innerHTML = ""; });

  document.getElementById("brand").addEventListener("click", function () { if (S.ekran !== "ana") { S.onay = "ana"; ciz(false); } });
  adresiTemizle();
  ciz(false);
})();

</script>
