<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Yanındayım: ortaokul öğrencileri için akran zorbalığına tanıklık üzerine dijital psikoeğitim uygulamasının başvuru demosu (prototip). Gerçek öğrenci verisi toplamaz.">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Yanındayım</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Düzen: tek sütunlu uygulama kabuğu; sahnelerde illüstrasyon + metin yan yana, dar ekranda alt alta. Bilinçli olarak tek (açık) tema. */
:root{
  --cream:#FBF6EC; --paper:#FFFDF8; --sand:#F1E8D6; --line:#E2D6BF;
  --ink:#1D2B53; --ink-2:#47527A; --ink-3:#7A829E;
  --teal:#1BA9A0; --teal-ink:#0B746D; --teal-soft:#D3EFEA; --teal-wash:#EEF9F7;
  --lilac:#9B87D9; --lilac-ink:#5A47A3; --lilac-soft:#ECE6FA;
  --peach:#F8DCC8; --peach-ink:#94461F;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{background:var(--cream);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(40px,7vw,68px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(27px,3.8vw,38px);font-weight:800}
h3{font-size:21px;font-weight:700}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:12px}

/* Üst bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cream);border-bottom:1.5px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink);font:800 23px/1 var(--f-display)}
.brand svg{width:36px;height:36px;flex:none}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.proto{display:inline-flex;align-items:center;gap:6px;background:var(--lilac-soft);color:var(--lilac-ink);font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.proto .dot{width:8px;height:8px;border-radius:50%;background:var(--lilac)}
.mapbtn{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px;color:var(--ink);cursor:pointer}
@media (max-width:560px){.proto .long{display:none}}

/* Kabuk */
.shell{max-width:1080px;margin:0 auto;padding-block:28px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:grid;gap:28px}
.enter{animation:enter .32s ease-out both}
@keyframes enter{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.split{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:36px;align-items:center}
.split.top{align-items:start}
@media (max-width:840px){.split{grid-template-columns:minmax(0,1fr);gap:22px}}
.stack{display:grid;gap:16px;min-width:0}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-ink)}
.lead{font-size:clamp(18px,2.1vw,21px);color:var(--ink-2);max-width:34em}
.muted{color:var(--ink-2)}
.small{font-size:14.5px}

/* İllüstrasyon çerçevesi */
.art{border:2.5px solid var(--ink);border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:7px 7px 0 var(--lilac-soft);max-width:100%}
.art svg{display:block;width:100%;height:auto}

/* Düğmeler */
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:800 17px/1.1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:15px;border:2.5px solid var(--ink);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn-primary{background:var(--ink);color:var(--paper);box-shadow:0 4px 0 var(--teal)}
.btn-primary:hover{box-shadow:0 5px 0 var(--teal)}
.btn-primary:active{box-shadow:0 1px 0 var(--teal)}
.btn-text{background:none;border:0;box-shadow:none;padding:0 6px;color:var(--ink-2);text-decoration:underline;text-underline-offset:4px;min-height:44px}
.btn-text:hover,.btn-text:active{box-shadow:none;transform:none;color:var(--ink)}
.btn svg{width:20px;height:20px}

/* Bilgi kutuları */
.note{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;background:var(--lilac-soft);border-radius:18px;padding:14px 16px;color:var(--ink);font-size:15.5px}
.note svg{width:28px;height:28px}
.note.teal{background:var(--teal-wash);border:1.5px solid var(--teal-soft)}
.note b{font-weight:800}

/* Karşılama */
.hero-title{display:grid;gap:10px}
.hero-title h1 span{color:var(--teal-ink)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--sand);color:var(--ink-2)}

/* Giriş */
.login-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;padding:26px;display:grid;gap:16px}
.field{display:grid;gap:8px}
.field label{font-weight:800}
.codein{font:800 26px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;width:100%;padding:16px 18px;border:2.5px solid var(--ink);border-radius:16px;background:var(--cream);color:var(--ink)}
.codein::placeholder{color:var(--ink-3);letter-spacing:.06em;font-weight:600}
.codein:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.err{color:#A3341F;font-weight:700;font-size:15px}
.sample{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px}
.sample code{font:800 17px var(--f-display);letter-spacing:.08em;background:var(--teal-soft);padding:4px 10px;border-radius:8px;color:var(--teal-ink)}

/* Harita */
.map-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:40px;align-items:start}
@media (max-width:880px){.map-grid{grid-template-columns:minmax(0,1fr);gap:24px}}
.path{display:grid;gap:18px;list-style:none;margin:0;padding:0}
.mod{display:grid;grid-template-columns:58px minmax(0,1fr);gap:16px;position:relative}
.mod:not(:last-child)::before{content:"";position:absolute;left:28px;top:60px;bottom:-18px;border-left:3px dashed var(--line)}
.node{width:58px;height:58px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font:800 26px/1 var(--f-display);background:var(--teal);color:var(--paper);position:relative;z-index:1}
.node.done{background:var(--teal-ink)}
.node svg{width:28px;height:28px}
.mod-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;padding:18px 20px;display:grid;gap:12px;box-shadow:0 4px 0 var(--ink)}
.mod-card h3{font-size:22px}
.mod.locked .node{background:var(--sand);color:var(--ink-3);border-color:var(--ink-3);border-style:dashed}
.mod.locked .mod-card{background:transparent;border:2px dashed #BDB4A2;box-shadow:none;padding:14px 18px;gap:6px}
.mod.locked h3{color:var(--ink-2);font-size:19px}
.mod.locked p{color:var(--ink-3);font-size:15px}
.lockchip{display:inline-flex;align-items:center;gap:6px;justify-self:start;font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--sand);padding:5px 10px;border-radius:999px}
.lockchip svg{width:14px;height:14px}
.parts{display:grid;gap:10px}
.part{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--cream)}
.part .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--teal-soft)}
.part .ico.l{background:var(--lilac-soft)}
.part .ico svg{width:22px;height:22px}
.part b{display:block;font-size:16.5px}
.part span{font-size:14px;color:var(--ink-2)}
.part .go{font:800 15px var(--f-body);border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:9px 14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.part .go.main{background:var(--ink);color:var(--paper)}
.status{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--teal-ink)}
.status svg{width:18px;height:18px}
@media (max-width:460px){.part{grid-template-columns:36px minmax(0,1fr)}.part .ico{width:36px;height:36px}.part .go,.part .status{grid-column:2;justify-self:start}}

/* Adım göstergesi */
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--sand);color:var(--ink-3);display:inline-flex;gap:5px;align-items:center}
.step.on{background:var(--ink);color:var(--paper)}
.step.ok{background:var(--teal-soft);color:var(--teal-ink)}
.step svg{width:14px;height:14px}

/* Eğitim */
.dots{display:flex;gap:8px}
.dots i{width:30px;height:8px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--teal)}
.facts{display:grid;gap:10px;list-style:none;padding:0;margin:0}
.facts li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700}
.facts .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft)}
.facts li:nth-child(2) .ic{background:var(--lilac-soft)}
.facts li:nth-child(3) .ic{background:var(--peach)}
.facts .ic svg{width:22px;height:22px}

/* Senaryo */
.scene-text{display:grid;gap:12px;font-size:18px}
.speech{background:var(--paper);border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;justify-self:start;max-width:100%}
.question{font:800 23px/1.2 var(--f-display);color:var(--ink);display:flex;align-items:center;gap:10px}
.question::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--teal);flex:none}
.choices{display:grid;gap:12px}
.choice{display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;align-items:center;text-align:left;width:100%;padding:14px 18px 14px 14px;min-height:78px;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);font:700 18px/1.35 var(--f-body);color:var(--ink);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
.choice:hover{background:var(--teal-wash);transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice .key{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);font:800 22px/1 var(--f-display);border:2.5px solid var(--ink)}
.choice:nth-child(2) .key{background:var(--lilac-soft)}
.choice:nth-child(3) .key{background:var(--peach)}
.choice.picked{background:var(--teal-soft);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.prev{display:inline-flex;gap:8px;align-items:center;font-size:14.5px;color:var(--ink-2);background:var(--sand);padding:6px 12px;border-radius:12px;justify-self:start}
.prev b{color:var(--ink)}

/* Geri bildirim */
.fb{background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;padding:clamp(18px,3vw,30px);display:grid;gap:20px}
.fb-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tone{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:7px 14px;border-radius:999px}
.tone i{width:10px;height:10px;border-radius:50%}
.tone.t{background:var(--teal-soft);color:var(--teal-ink)} .tone.t i{background:var(--teal)}
.tone.l{background:var(--lilac-soft);color:var(--lilac-ink)} .tone.l i{background:var(--lilac)}
.tone.p{background:var(--peach);color:var(--peach-ink)} .tone.p i{background:#E0874F}
.fb-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:680px){.fb-cols{grid-template-columns:minmax(0,1fr)}}
.col{border-radius:18px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.col.a{background:var(--teal-wash)}
.col.b{background:#FDF3EA}
.col h3{font-size:18px;display:flex;align-items:center;gap:8px}
.col h3 svg{width:22px;height:22px}
.col ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.col li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:baseline;font-size:16.5px}
.col li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--teal);transform:translateY(-1px)}
.col.b li::before{background:#E0874F}
.nextstep{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;background:var(--lilac-soft);border-radius:18px;padding:14px 18px}
.nextstep .ic{width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;border:2px solid var(--lilac)}
.nextstep .ic svg{width:24px;height:24px}
.nextstep b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac-ink)}
.caveat{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);border-top:1.5px dashed var(--line);padding-top:14px}
.caveat svg{width:20px;height:20px;flex:none;margin-top:2px}

/* Tamamlama */
.done-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.done-head svg.badge{width:clamp(130px,18vw,180px);height:auto}
@media (max-width:620px){.done-head{grid-template-columns:minmax(0,1fr);justify-items:start}}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.cards3{grid-template-columns:minmax(0,1fr)}}
.take{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:18px;display:grid;gap:8px;align-content:start}
.take .n{font:800 15px var(--f-display);color:var(--teal-ink)}
.take p{font-weight:700;font-size:16.5px}
.pathsum{display:grid;gap:8px;background:var(--sand);border-radius:18px;padding:16px 18px}
.pathsum div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;font-size:16px}
.pathsum span{font-weight:800;color:var(--ink-2);font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
.adults{display:flex;flex-wrap:wrap;gap:8px}
.adults span{background:var(--teal-soft);color:var(--teal-ink);font-weight:800;padding:8px 14px;border-radius:999px;font-size:15px}

/* Alt bilgi */
.foot{max-width:1080px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 14px}
.foot b{color:var(--ink-2)}

/* Demo menüsü */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:8px;background:var(--lilac-ink);color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:12px 18px;font:800 15px var(--f-body);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.fab svg{width:18px;height:18px}
.fab-mini{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink-3);background:var(--paper);opacity:.35;cursor:pointer;display:none}
.fab-mini:hover,.fab-mini:focus-visible{opacity:1}
body.shot .fab{display:none}
body.shot .fab-mini{display:block}
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(29,43,83,.38);display:flex;justify-content:flex-end}
.sheet{width:min(420px,100%);height:100%;overflow:auto;background:var(--paper);border-left:2.5px solid var(--ink);padding:calc(18px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:grid;gap:18px;align-content:start;animation:slide .22s ease-out both}
@keyframes slide{from{transform:translateX(24px);opacity:.001}to{transform:none;opacity:1}}
@media (max-width:600px){
  .sheet-wrap{align-items:flex-end}
  .sheet{width:100%;height:auto;max-height:86%;border-left:0;border-top:2.5px solid var(--ink);border-radius:24px 24px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px))}
}
.sheet-head{display:flex;align-items:flex-start;gap:12px}
.sheet-head h2{font-size:26px}
.sheet-head p{font-size:14.5px;color:var(--ink-2);margin-top:4px}
.x{margin-left:auto;width:42px;height:42px;flex:none;border-radius:50%;border:2px solid var(--ink);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.grp{display:grid;gap:8px}
.grp h3{font:800 12.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.jump{display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;align-items:center;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);color:var(--ink);font:700 15px/1.3 var(--f-body);cursor:pointer}
.jump:hover{border-color:var(--ink)}
.jump.cur{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.jump i{width:10px;height:10px;border-radius:50%;background:var(--ink-3)}
.jump i.t{background:var(--teal)} .jump i.l{background:var(--lilac)} .jump i.p{background:#E0874F}
.jump small{display:block;font-weight:600;font-size:13px;opacity:.75}
.tools{display:grid;gap:10px}
.toggle{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--lilac-soft);cursor:pointer;font-weight:700;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--lilac-ink)}
.reset{display:grid;gap:10px;padding:12px;border-radius:14px;border:2px solid #E7B8A4;background:#FDF3EE}
.reset p{font-size:14.5px}
.reset .row{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{font:800 15px var(--f-body);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--paper);color:var(--ink);cursor:pointer}
.sbtn.danger{background:#A3341F;border-color:#A3341F;color:#fff}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);font-weight:800;padding:12px 18px;border-radius:14px;font-size:15px;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <button class="brand" id="brand" type="button" aria-label="Yanındayım ana ekran">

  const r = ROUTES[id]; if(!r) return;
  if(r.login) S.logged = true;
  if(r.trained) S.trained = true;
  if("c1" in r) S.c1 = r.c1;
  if("c2" in r) S.c2 = r.c2;
  if(id === "tamam"){
    S.done = true;
    if(!S.c1 || !S.c2){ S.c1 = "A"; S.c2 = "A"; }
  }
  S.view = id; save(); render(opts && opts.keepScroll);
  try{ history.replaceState(null, "", "#" + id); }catch(e){}
}

function stepper(cur){
  const items = [["e","Eğitim"],["1","Karar 1"],["2","Karar 2"],["g","Geri bildirim"]];
  const order = ["e","1","2","g"], ci = order.indexOf(cur);
  return '<div class="steps" aria-label="Modül 1 ilerlemesi">' + items.map(function(it, i){
    const cls = i < ci ? "ok" : (i === ci ? "on" : "");
    return '<span class="step '+cls+'"'+(i===ci?' aria-current="step"':'')+'>'+(i<ci?I.check:"")+it[1]+'</span>';
  }).join("") + '</div>';
}

function vWelcome(){
  return '<section class="screen"><div class="split">'+
    '<div class="stack">'+
      '<div class="badges"><span class="pill">Ortaokul öğrencileri için</span><span class="pill">Dijital psikoeğitim</span></div>'+
      '<div class="hero-title"><h1 tabindex="-1">Yanında<span>yım</span></h1>'+
      '<p class="lead">Bir arkadaşın zor bir an yaşadığında neler yapabileceğini birlikte keşfedelim. Doğru ya da yanlış cevap aramıyoruz; seçeneklerin olası etkilerini konuşuyoruz.</p></div>'+
      '<div class="btns"><button class="btn btn-primary" data-go="'+(S.logged?"harita":"giris")+'">'+(S.logged?"Haritama devam et":"Başla")+I.arrow+'</button>'+
      '<span class="muted small">Yaklaşık 8–10 dakika</span></div>'+
      '<div class="note">'+I.info+'<div><b>Bu bir prototiptir.</b> Başvuru amacıyla hazırlanmış bir demodur. Gerçek öğrenci verisi toplamaz; seçimlerin yalnızca bu cihazdaki tarayıcıda tutulur.</div></div>'+
    '</div>'+
    '<div class="art">'+ART.welcome()+'</div>'+
  '</div></section>';
}

function vLogin(err, val){
  return '<section class="screen"><div class="split">'+
    '<div class="stack">'+
      '<p class="eyebrow">Giriş</p>'+
      '<h2 tabindex="-1">Katılımcı kodunu yaz</h2>'+
      '<p class="lead">Ad, okul ya da e-posta istemiyoruz. Uygulamada yalnızca sana verilen kodu kullanırsın.</p>'+
      '<form class="login-card" id="loginForm" novalidate>'+
        '<div class="field"><label for="code">Katılımcı kodu</label>'+
        '<input class="codein" id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ÖRN. YNM-0000" value="'+(val||"")+'" aria-describedby="codehelp'+(err?' codeerr':'')+'"'+(err?' aria-invalid="true"':'')+'></div>'+
        (err ? '<p class="err" id="codeerr">Bu kod tanınmadı. Demo için örnek kodu kullanabilirsin.</p>' : '')+
        '<div class="sample" id="codehelp">Örnek kod: <code>'+CODE+'</code><button type="button" class="btn-text btn" data-act="fill">Kodu doldur</button></div>'+
        '<div class="btns"><button class="btn btn-primary" type="submit">Giriş yap'+I.arrow+'</button></div>'+
      '</form>'+
      '<div class="note teal">'+I.shield+'<div>Gerçek bir uygulamada kod araştırma ekibi tarafından verilir. Bu demoda hesap ya da sunucu yoktur; kod yalnızca giriş akışını göstermek içindir.</div></div>'+
    '</div>'+
    '<div class="art">'+ART.login()+'</div>'+
  '</div></section>';
}

function vMap(){
  const m1 = MODULES[0];
  const tDone = S.trained, sDone = S.done;
  const m1html = '<li class="mod"><div class="node'+(sDone?" done":"")+'">'+(sDone?I.check:"1")+'</div>'+
    '<div class="mod-card"><p class="eyebrow">Modül 1 · Açık</p><h3>'+m1.t+'</h3><p class="muted">'+m1.d+'</p>'+
    '<div class="parts">'+
      '<div class="part"><div class="ico">'+I.book+'</div><div><b>Kısa eğitim</b><span>3 kart · yaklaşık 3 dk</span></div>'+
        (tDone ? '<span class="status">'+I.check+'Tamam</span>' : '<button class="go main" data-go="egitim-1">Başla</button>')+'</div>'+
      '<div class="part"><div class="ico l">'+I.path+'</div><div><b>Senaryo: Sınıfta dışlanan öğrenci</b><span>2 karar noktası · yaklaşık 5 dk</span></div>'+
        (sDone ? '<button class="go" data-go="karar-1">Tekrar oyna</button>' : '<button class="go'+(tDone?" main":"")+'" data-go="karar-1">'+(tDone?"Başla":"Senaryoya geç")+'</button>')+'</div>'+
    '</div></div></li>';
  const rest = MODULES.slice(1).map(function(m){
    return '<li class="mod locked" aria-disabled="true"><div class="node">'+m.n+'</div><div class="mod-card">'+
      '<span class="lockchip">'+I.lock+'Demo kapsamı dışında</span><h3>Modül '+m.n+' · '+m.t+'</h3><p>'+m.d+'</p></div></li>';
  }).join("");
  return '<section class="screen"><div class="map-grid">'+
    '<div class="stack">'+
      '<p class="eyebrow">Öğrenme haritası</p>'+
      '<h2 tabindex="-1">Beş adımda yanında olmayı öğren</h2>'+
      '<p class="lead">Her modülde kısa bir eğitim ve bir okul senaryosu var. Senaryolarda seçimini yapar, olası sonuçlarını birlikte düşünürüz.</p>'+
      '<div class="note">'+I.info+'<div><b>Bu demoda yalnızca 1. modül çalışır.</b> Diğer modüller, planlanan içeriği göstermek için listelenmiştir.</div></div>'+
    '</div>'+
    '<ol class="path">'+m1html+rest+'</ol>'+
  '</div></section>';
}

function vTrain(i){
  const t = TRAIN[i];
  const prev = i === 0 ? "harita" : "egitim-" + i;
  const next = i === 2 ? "karar-1" : "egitim-" + (i + 2);
  return '<section class="screen">'+stepper("e")+'<div class="split">'+
    '<div class="art">'+ART[t.art]()+'</div>'+
    '<div class="stack">'+
      '<div class="dots" aria-label="'+(i+1)+'. kart, toplam 3">'+[0,1,2].map(function(k){return '<i class="'+(k<=i?"on":"")+'"></i>';}).join("")+'</div>'+
      '<p class="eyebrow">'+t.eye+'</p>'+
      '<h2 tabindex="-1">'+t.title+'</h2>'+
      '<p class="lead">'+t.body+'</p>'+
      '<ul class="facts">'+t.facts.map(function(f){return '<li><span class="ic">'+I[f[0]]+'</span><span>'+f[1]+'</span></li>';}).join("")+'</ul>'+
      '<div class="btns"><button class="btn" data-go="'+prev+'">'+I.back+'Geri</button>'+
      '<button class="btn btn-primary" data-go="'+next+'">'+(i===2?"Senaryoya başla":"İleri")+I.arrow+'</button></div>'+
    '</div>'+
  '</div></section>';
}

function vScene(id){
  const sc = SCENES[id];
  let txt = sc.text.map(function(p, k){
    return (sc.speech && k === sc.speech) ? '<p class="speech">'+p+'</p>' : '<p>'+p+'</p>';
  }).join("");
  let prev = "";
  if(sc.from){
    const o = SCENES["karar-1"].opts.filter(function(x){return x.k === sc.from;})[0];
    prev = '<p class="prev">İlk seçimin: <b>'+o.k+'</b> · '+o.t+'</p>';
  }
  return '<section class="screen">'+stepper(String(sc.step))+'<div class="split top">'+
    '<div class="art">'+ART[sc.art]()+'</div>'+
    '<div class="stack">'+
      '<p class="eyebrow">Senaryo · Sınıfta dışlanan öğrenci · Karar '+sc.step+'/2</p>'+
      prev+
      '<h2 tabindex="-1">'+sc.title+'</h2>'+
      '<p class="muted small">'+sc.place+'</p>'+
      '<div class="scene-text">'+txt+'</div>'+
      '<p class="question">'+sc.q+'</p>'+
      '<div class="choices" role="group" aria-label="Seçenekler">'+sc.opts.map(function(o){
        return '<button class="choice" data-pick="'+o.to+'"><span class="key" aria-hidden="true">'+o.k+'</span><span>'+o.t+'</span></button>';
      }).join("")+'</div>'+
    '</div>'+
  '</div></section>';
}

function optText(step, key, branch){
  const sc = step === 1 ? SCENES["karar-1"] : SCENES["karar-2" + branch.toLowerCase()];
  const o = sc.opts.filter(function(x){return x.k === key;})[0];
  return o ? o.t : "";
}

function vResult(id){
  const r = RESULTS[id];
  return '<section class="screen">'+stepper("g")+
    '<div class="split">'+
      '<div class="art">'+ART[r.art]()+'</div>'+
      '<div class="stack">'+
        '<p class="eyebrow">Sonra ne oldu?</p>'+
        '<div class="pathsum"><div><span>Karar 1</span><p>'+optText(1, r.c1)+'</p></div><div><span>Karar 2</span><p>'+optText(2, r.c2, r.c1)+'</p></div></div>'+
        '<p class="lead" style="color:var(--ink)">'+r.story+'</p>'+
      '</div>'+
    '</div>'+
    '<div class="fb">'+
      '<div class="fb-head"><h2 tabindex="-1">Bu seçimin olası etkileri</h2><span class="tone '+r.tone+'"><i></i>'+r.tag+'</span></div>'+
      '<div class="fb-cols">'+
        '<div class="col a"><h3>'+I.sprout+'Neyi sağlayabilir?</h3><ul>'+r.plus.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul></div>'+
        '<div class="col b"><h3>'+I.eye+'Neye dikkat etmek gerekebilir?</h3><ul>'+r.care.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul></div>'+
      '</div>'+
      '<div class="nextstep"><span class="ic">'+I.hand+'</span><div><b>Bir sonraki adım için</b>'+r.next+'</div></div>'+
      '<p class="caveat">'+I.info+'<span>Bu, olası sonuçlardan yalnızca biri. Gerçek hayatta her durum farklı gelişebilir; hiçbir seçim kesin bir sonucu garanti etmez.</span></p>'+
    '</div>'+
    '<div class="btns"><button class="btn btn-primary" data-go="tamam">Modülü tamamla'+I.arrow+'</button>'+
    '<button class="btn" data-go="karar-1">'+I.repeat+'Farklı bir seçim dene</button></div>'+
  '</section>';
}

function badge(){
  return '<svg class="badge" viewBox="0 0 200 220" role="img" aria-label="Modül 1 rozeti">'+
    '<defs><clipPath id="bclip"><circle cx="100" cy="96" r="68"/></clipPath></defs>'+
    '<path d="M64 150 L50 214 L76 200 L90 220 L100 160Z" fill="'+P.lilac+'" '+ST+'/><path d="M136 150 L150 214 L124 200 L110 220 L100 160Z" fill="'+P.lilac+'" '+ST+'/>'+
    '<circle cx="100" cy="96" r="88" fill="'+P.teal+'" '+ST+'/>'+
    '<circle cx="100" cy="96" r="76" fill="none" stroke="'+P.paper+'" stroke-width="3" stroke-dasharray="6 8"/>'+
    '<circle cx="100" cy="96" r="68" fill="'+P.tealSoft+'" '+ST+'/>'+
    '<g clip-path="url(#bclip)">'+
      kid(Object.assign({}, CH.sen, {x:78, y:186, s:.82, mood:"happy", showTag:false}))+
      kid(Object.assign({}, CH.defne, {x:124, y:186, s:.82, mood:"happy", showTag:false}))+
    '</g>'+
  '</svg>';
}

function vDone(){
  const c1 = S.c1 || "A", c2 = S.c2 || "A";
  return '<section class="screen">'+
    '<div class="done-head">'+badge()+
      '<div class="stack"><p class="eyebrow">Modül 1 tamamlandı</p><h2 tabindex="-1">Bugün yanında olmanın yollarını keşfettin</h2>'+
      '<p class="lead">Her seçim farklı bir yol açtı. Önemli olan, bir dahaki sefere hangi adımları atabileceğini bilmek.</p></div>'+
    '</div>'+
    '<div class="pathsum"><div><span>Karar 1</span><p>'+optText(1, c1)+'</p></div><div><span>Karar 2</span><p>'+optText(2, c2, c1)+'</p></div></div>'+
    '<div class="cards3">'+
      '<div class="take"><span class="n">Akılda kalsın · 1</span><p>Dışlanmak da incitir. Fark etmek ilk adımdır.</p></div>'+
      '<div class="take"><span class="n">Akılda kalsın · 2</span><p>Yanında olmak için büyük bir şey yapman gerekmez: bir selam, bir soru, yanına oturmak.</p></div>'+
      '<div class="take"><span class="n">Akılda kalsın · 3</span><p>Yardım istemek ispiyonculuk değildir. Güvendiğin bir yetişkine anlatmak arkadaşını korumaya yardımcı olabilir.</p></div>'+
    '</div>'+
    '<div class="stack"><h3>Okulda kime anlatabilirsin?</h3><div class="adults"><span>Sınıf öğretmenin</span><span>Rehber öğretmen</span><span>Nöbetçi öğretmen</span><span>Ailen</span><span>Okul idaresi</span></div></div>'+
    '<div class="note teal">'+I.shield+'<div><b>Kendini ya da bir arkadaşını güvende hissetmiyorsan</b> hemen güvendiğin bir yetişkine söyle. Bu uygulama bir prototiptir ve gerçek zamanlı destek sunmaz.</div></div>'+
    '<div class="btns"><button class="btn btn-primary" data-go="harita">Öğrenme haritasına dön'+I.arrow+'</button>'+
    '<button class="btn" data-go="karar-1">'+I.repeat+'Senaryoyu tekrar oyna</button></div>'+
  '</section>';
}

/* ---------------- Çizim ---------------- */
const app = document.getElementById("app");
let loginErr = false, loginVal = "";
function render(keepScroll){
  const v = S.view;
  let html;
  if(v === "karsilama") html = vWelcome();
  else if(v === "giris") html = vLogin(loginErr, loginVal);
  else if(v === "harita") html = vMap();
  else if(v.indexOf("egitim-") === 0) html = vTrain(parseInt(v.slice(7), 10) - 1);
  else if(SCENES[v]) html = vScene(v);
  else if(RESULTS[v]) html = vResult(v);
  else if(v === "tamam") html = vDone();
  else { S.view = "karsilama"; html = vWelcome(); }
  app.innerHTML = html;
  app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter");
  document.getElementById("mapbtn").hidden = !S.logged || v === "harita";
  document.body.classList.toggle("shot", !!S.shot);
  if(!keepScroll){ window.scrollTo(0, 0); }
  const h = app.querySelector("[tabindex='-1']");
  if(h && document.activeElement && document.activeElement !== document.body){ try{ h.focus({preventScroll:true}); }catch(e){} }
  if(!document.getElementById("sheet").hidden) buildSheet();
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 2200);
}

/* ---------------- Demo görünümü menüsü ---------------- */
function jump(id, label, sub, dot){
  return '<button class="jump'+(S.view===id?" cur":"")+'" data-go="'+id+'" data-close="1"><i class="'+(dot||"")+'"></i><span>'+label+(sub?'<small>'+sub+'</small>':'')+'</span></button>';
}
function buildSheet(){
  const b = document.getElementById("sheet-body");
  let res = "";
  ["a","b","c"].forEach(function(br){
    [1,2,3].forEach(function(n){
      const id = "sonuc-" + br + n, r = RESULTS[id];
      res += jump(id, br.toUpperCase()+" → "+r.c2+" · "+RES_SHORT[id], r.tag, r.tone);
    });
  });
  b.innerHTML =
    '<div class="sheet-head"><div><h2 id="sheet-title">Demo görünümü</h2><p>Ekran görüntüsü için sahnelere ve sonuçlara doğrudan geç. Bu menü öğrenci deneyiminin parçası değildir.</p></div>'+
    '<button class="x" type="button" data-act="close" aria-label="Menüyü kapat">'+I.close+'</button></div>'+
    '<div class="grp"><h3>Akış</h3>'+jump("karsilama","Karşılama")+jump("giris","Örnek kodla giriş")+jump("harita","Öğrenme haritası (5 modül)")+jump("egitim-1","Kısa eğitim · 1/3","Akran zorbalığı nedir?")+jump("egitim-2","Kısa eğitim · 2/3","Dışlamak da zorbalık olabilir")+jump("egitim-3","Kısa eğitim · 3/3","Tanık olarak senin rolün")+'</div>'+
    '<div class="grp"><h3>Senaryo · Karar noktaları</h3>'+jump("karar-1","Karar 1 · Grup çalışması")+jump("karar-2a","Karar 2 · A yolu","Teneffüste Defne anlatıyor")+jump("karar-2b","Karar 2 · B yolu","Ege sana dönüyor")+jump("karar-2c","Karar 2 · C yolu","Ertesi gün yemekhane")+'</div>'+
    '<div class="grp"><h3>Sonuçlar ve geri bildirim (9)</h3>'+res+'</div>'+
    '<div class="grp"><h3>Bitiş</h3>'+jump("tamam","Tamamlama ekranı")+'</div>'+
    '<div class="grp tools"><h3>Araçlar</h3>'+
      '<label class="toggle"><input type="checkbox" id="shotToggle"'+(S.shot?" checked":"")+'>Ekran görüntüsü modu: demo düğmesini gizle</label>'+
      '<p class="small muted">Bu modda menüyü sağ alttaki küçük noktadan ya da Esc tuşuyla yeniden açabilirsin.</p>'+
      (resetAsk ?
        '<div class="reset"><p><b>Tüm demo ilerlemesi silinsin mi?</b> Giriş, eğitim ve senaryo seçimleri bu tarayıcıdan kaldırılır.</p><div class="row"><button class="sbtn danger" type="button" data-act="reset-yes">Evet, sıfırla</button><button class="sbtn" type="button" data-act="reset-no">Vazgeç</button></div></div>' :
        '<button class="sbtn" type="button" data-act="reset-ask">Demoyu sıfırla</button>')+
    '</div>';
}
let lastFocus = null;
function openSheet(){
  lastFocus = document.activeElement;
  resetAsk = false; buildSheet();
  document.getElementById("sheet").hidden = false;
  const x = document.querySelector("#sheet .x"); if(x) x.focus();
}
function closeSheet(){
  document.getElementById("sheet").hidden = true; resetAsk = false;
  if(lastFocus && lastFocus.focus){ try{ lastFocus.focus({preventScroll:true}); }catch(e){} }
}

/* ---------------- Olaylar ---------------- */
document.addEventListener("click", function(e){
  const pick = e.target.closest("[data-pick]");
  if(pick){
    pick.classList.add("picked");
    app.querySelectorAll(".choice").forEach(function(c){ c.disabled = true; });
    const to = pick.getAttribute("data-pick");
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(function(){ go(to); }, reduce ? 0 : 260);
    return;
  }
  const g = e.target.closest("[data-go]");
  if(g){
    const id = g.getAttribute("data-go");
    if(g.hasAttribute("data-close")) closeSheet();
    if(id === "giris"){ loginErr = false; loginVal = ""; }
    go(id);
    return;
  }
  const a = e.target.closest("[data-act]");
  if(!a) return;
  const act = a.getAttribute("data-act");
  if(act === "fill"){ const i = document.getElementById("code"); if(i){ i.value = CODE; i.focus(); } }
  else if(act === "close") closeSheet();
  else if(act === "reset-ask"){ resetAsk = true; buildSheet(); const y = document.querySelector("#sheet .danger"); if(y) y.focus(); }
  else if(act === "reset-no"){ resetAsk = false; buildSheet(); }
  else if(act === "reset-yes"){
    wipe(); S = Object.assign({}, DEF); loginErr = false; loginVal = "";
    closeSheet(); go("karsilama"); toast("Demo sıfırlandı");
  }
});
document.getElementById("sheet").addEventListener("click", function(e){ if(e.target.id === "sheet") closeSheet(); });
document.addEventListener("change", function(e){
  if(e.target.id === "shotToggle"){
    S.shot = e.target.checked; save(); document.body.classList.toggle("shot", S.shot);
    toast(S.shot ? "Ekran görüntüsü modu açık" : "Ekran görüntüsü modu kapalı");
  }
});
document.addEventListener("submit", function(e){
  if(e.target.id !== "loginForm") return;
  e.preventDefault();
  const v = (document.getElementById("code").value || "").toUpperCase().replace(/[\s\-–]/g, "");
  if(v === CODE.replace("-", "")){
    loginErr = false; loginVal = ""; S.logged = true; go("harita");
  } else {
    loginErr = true; loginVal = (document.getElementById("code").value || "").replace(/[^A-Za-z0-9\-\s]/g, "").slice(0, 16);
    render(true); const i = document.getElementById("code"); if(i) i.focus();
  }
});
document.getElementById("fab").addEventListener("click", openSheet);
document.getElementById("fabmini").addEventListener("click", openSheet);
document.getElementById("brand").addEventListener("click", function(){ go(S.logged ? "harita" : "karsilama"); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(!document.getElementById("sheet").hidden) closeSheet(); else if(S.shot) openSheet();
  }
});
window.addEventListener("hashchange", function(){
  const h = location.hash.replace("#", "");
  if(ROUTES[h] && h !== S.view) go(h);
});

/* ---------------- Başlat ---------------- */
load();
const h0 = (location.hash || "").replace("#", "");
if(ROUTES[h0]) go(h0); else render();
})();
</script>
