<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yanındayım</title>
<meta name="description" content="Yanındayım: akran zorbalığına ve siber zorbalığa tanık olan ortaokul öğrencileri için dijital psikoeğitim uygulamasının demo sürümü (prototip). Gerçek öğrenci verisi toplamaz.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<style>
/* Yanındayım — tek (açık) tema; okul defteri kremi, lacivert metin, turkuaz ve yumuşak mor vurgular. */
:root{
  --cream:#FBF6EC; --paper:#FFFDF8; --sand:#F1E8D6; --line:#E2D6BF;
  --ink:#1D2B53; --ink-2:#47527A; --ink-3:#6E7694;
  --teal:#1BA9A0; --teal-ink:#0B746D; --teal-soft:#D3EFEA; --teal-wash:#EEF9F7;
  --lilac:#9B87D9; --lilac-ink:#5A47A3; --lilac-soft:#ECE6FA;
  --peach:#F8DCC8; --peach-ink:#94461F; --warn-bg:#FDF3EE; --warn-line:#E7B8A4; --danger:#A3341F;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{background:var(--cream);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cream)}
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(40px,7vw,68px);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(26px,3.8vw,38px);font-weight:800}
h3{font-size:21px;font-weight:700}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:12px}

/* Üst bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cream);border-bottom:1.5px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;cursor:pointer;color:var(--ink);font:800 23px/1 var(--f-display)}
.brand svg{width:36px;height:36px;flex:none}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.proto{display:inline-flex;align-items:center;gap:6px;background:var(--lilac-soft);color:var(--lilac-ink);font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.proto .dot{width:8px;height:8px;border-radius:50%;background:var(--lilac)}
.proto.res{background:var(--teal-soft);color:var(--teal-ink)} .proto.res .dot{background:var(--teal)}
.sync{font-size:13px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--sand);color:var(--ink-2)}
.sync.ok{background:var(--teal-soft);color:var(--teal-ink)} .sync.wait{background:var(--warn-bg);color:var(--peach-ink)}
.mapbtn{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px;color:var(--ink);cursor:pointer}
@media (max-width:560px){.proto .long{display:none}.brand{font-size:20px}.brand svg{width:30px;height:30px}}

/* Kabuk */
.shell{max-width:1080px;margin:0 auto;padding-block:24px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:grid;gap:26px}
.enter{animation:enter .28s ease-out both}
@keyframes enter{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.split{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:36px;align-items:center}
.split.top{align-items:start}
@media (max-width:840px){.split{grid-template-columns:minmax(0,1fr);gap:22px}}
.stack{display:grid;gap:16px;min-width:0;align-content:start}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-ink)}
.lead{font-size:clamp(18px,2.1vw,21px);color:var(--ink-2);max-width:36em}
.muted{color:var(--ink-2)}
.small{font-size:14.5px}
.narrow{max-width:720px;margin-inline:auto;width:100%}

.art{border:2.5px solid var(--ink);border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:7px 7px 0 var(--lilac-soft);max-width:100%}
.art svg{display:block;width:100%;height:auto}

/* Düğmeler */
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:800 17px/1.1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:15px;border:2.5px solid var(--ink);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;color:var(--ink);background:var(--paper);box-shadow:0 4px 0 var(--ink);text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 2px 0 var(--ink)}
.btn-primary{background:var(--ink);color:var(--paper);box-shadow:0 4px 0 var(--teal)}
.btn-primary:hover{box-shadow:0 5px 0 var(--teal)}
.btn-primary:active{box-shadow:0 1px 0 var(--teal)}
.btn-text{background:none;border:0;box-shadow:none;padding:0 6px;color:var(--ink-2);text-decoration:underline;text-underline-offset:4px;min-height:44px}
.btn-text:hover,.btn-text:active{box-shadow:none;transform:none;color:var(--ink)}
.btn svg{width:20px;height:20px}

/* Bilgi kutuları */
.note{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;background:var(--lilac-soft);border-radius:18px;padding:14px 16px;color:var(--ink);font-size:15.5px}
.note svg{width:28px;height:28px}
.note.teal{background:var(--teal-wash);border:1.5px solid var(--teal-soft)}
.note.warn{background:var(--warn-bg);border:1.5px solid var(--warn-line)}
.note b{font-weight:800}
.note ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--sand);color:var(--ink-2)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.hero-title{display:grid;gap:10px}
.hero-title h1 span{color:var(--teal-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--sand);color:var(--ink-2);justify-self:start}
.chip svg{width:14px;height:14px}
.chip.teal{background:var(--teal-soft);color:var(--teal-ink)}
.chip.lilac{background:var(--lilac-soft);color:var(--lilac-ink)}
.chip.warn{background:var(--warn-bg);color:var(--peach-ink)}

/* Giriş */
.login-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;padding:24px;display:grid;gap:16px}
.field{display:grid;gap:8px}
.field label{font-weight:800}
.codein{font:800 26px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;width:100%;padding:16px 18px;border:2.5px solid var(--ink);border-radius:16px;background:var(--cream);color:var(--ink)}
.codein::placeholder{color:var(--ink-3);letter-spacing:.06em;font-weight:600}
.codein:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.err{color:var(--danger);font-weight:700;font-size:15px}
.sample{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px}
.sample code{font:800 17px var(--f-display);letter-spacing:.08em;background:var(--teal-soft);padding:4px 10px;border-radius:8px;color:var(--teal-ink)}

/* Adım çizgisi (akış) */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--sand);color:var(--ink-3);display:inline-flex;gap:5px;align-items:center}
.step.on{background:var(--ink);color:var(--paper)}
.step.ok{background:var(--teal-soft);color:var(--teal-ink)}
.step svg{width:14px;height:14px}

/* Harita */
.map-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:40px;align-items:start}
@media (max-width:880px){.map-grid{grid-template-columns:minmax(0,1fr);gap:24px}}
.path{display:grid;gap:16px;list-style:none;margin:0;padding:0}
.mod{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;position:relative}
.mod:not(:last-child)::before{content:"";position:absolute;left:26px;top:56px;bottom:-16px;border-left:3px dashed var(--line)}
.node{width:54px;height:54px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font:800 24px/1 var(--f-display);background:var(--teal);color:var(--paper);position:relative;z-index:1}
.node.done{background:var(--teal-ink)}
.node.gate{background:var(--lilac);}
.node svg{width:26px;height:26px}
.mod-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:16px 18px;display:grid;gap:10px;box-shadow:0 4px 0 var(--ink)}
.mod-card h3{font-size:21px}
.mod-card .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.mod.locked .node{background:var(--sand);color:var(--ink-3);border-color:var(--ink-3);border-style:dashed}
.mod.locked .mod-card{background:transparent;border:2px dashed #BDB4A2;box-shadow:none}
.mod.locked h3{color:var(--ink-2)}
.mod.locked p{color:var(--ink-3)}
.go{font:800 15px var(--f-body);border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:9px 14px;cursor:pointer;color:var(--ink);white-space:nowrap}
.go.main{background:var(--ink);color:var(--paper)}
.status{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:14px;color:var(--teal-ink)}
.status svg{width:18px;height:18px}

/* Eğitim kartları */
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots i{width:28px;height:8px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--teal)}
.facts{display:grid;gap:10px;list-style:none;padding:0;margin:0}
.facts li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700}
.facts .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft)}
.facts li:nth-child(2) .ic{background:var(--lilac-soft)}
.facts li:nth-child(3) .ic{background:var(--peach)}
.facts .ic svg{width:22px;height:22px}

/* Etkinlikler */
.act{display:grid;gap:18px}
.act-item{background:var(--paper);border:2.5px solid var(--ink);border-radius:22px;padding:18px;display:grid;gap:14px}
.act-item .q{font-weight:800;font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{font:800 16px/1.25 var(--f-body);text-align:left;padding:12px 16px;min-height:52px;border-radius:14px;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.opt:hover{background:var(--teal-wash)}
.opt[aria-pressed="true"]{background:var(--lilac-soft);box-shadow:0 1px 0 var(--ink);transform:translateY(2px)}
.opt.sugg{border-color:var(--teal-ink)}
.explain{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;background:var(--teal-wash);border-radius:14px;padding:12px 14px;font-size:16px}
.explain svg{width:22px;height:22px}
.explain b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-ink)}
.flip{perspective:900px;border:0;background:none;padding:0;cursor:pointer;text-align:left;width:100%}
.flip-in{display:grid;min-height:130px;border:2.5px solid var(--ink);border-radius:20px;padding:18px;box-shadow:0 4px 0 var(--ink);background:var(--paper);font:800 18px/1.35 var(--f-body);color:var(--ink);align-content:center;gap:6px}
.flip.open .flip-in{background:var(--teal-wash)}
.flip small{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.flips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.flips{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{font:800 15px var(--f-body);padding:10px 14px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;min-height:44px}
.chipbtn[aria-pressed="true"]{background:var(--lilac-soft)}
.script{background:var(--paper);border:2px dashed var(--lilac);border-radius:18px;padding:16px 18px;display:grid;gap:6px;font-size:16.5px}

/* Senaryo */
.scene-text{display:grid;gap:12px;font-size:18px}
.speech{background:var(--paper);border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;justify-self:start;max-width:100%}
.question{font:800 23px/1.2 var(--f-display);color:var(--ink);display:flex;align-items:center;gap:10px}
.question::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--teal);flex:none}
.choices{display:grid;gap:12px}
.choice{display:grid;grid-template-columns:46px minmax(0,1fr);gap:14px;align-items:center;text-align:left;width:100%;padding:14px 18px 14px 14px;min-height:78px;background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);font:700 18px/1.35 var(--f-body);color:var(--ink);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
.choice:hover{background:var(--teal-wash);transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice .key{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--teal-soft);font:800 22px/1 var(--f-display);border:2.5px solid var(--ink)}
.choice:nth-child(2) .key{background:var(--lilac-soft)}
.choice:nth-child(3) .key{background:var(--peach)}
.choice.picked{background:var(--teal-soft);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.prev{display:inline-flex;gap:8px;align-items:baseline;font-size:14.5px;color:var(--ink-2);background:var(--sand);padding:6px 12px;border-radius:12px;justify-self:start}
.prev b{color:var(--ink)}
.sc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.sc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.sc-grid{grid-template-columns:minmax(0,1fr)}}
.sc-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;box-shadow:0 4px 0 var(--ink)}
.sc-card .art{border:0;border-bottom:2.5px solid var(--ink);border-radius:0;box-shadow:none}
.sc-card .body{padding:14px 16px;display:grid;gap:8px;align-content:start}
.sc-card h3{font-size:19px}
.sc-card .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:4px}

/* Geri bildirim */
.fb{background:var(--paper);border:2.5px solid var(--ink);border-radius:26px;padding:clamp(18px,3vw,30px);display:grid;gap:20px}
.fb-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tone{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;padding:7px 14px;border-radius:999px}
.tone i{width:10px;height:10px;border-radius:50%}
.tone.t{background:var(--teal-soft);color:var(--teal-ink)} .tone.t i{background:var(--teal)}
.tone.l{background:var(--lilac-soft);color:var(--lilac-ink)} .tone.l i{background:var(--lilac)}
.tone.p{background:var(--peach);color:var(--peach-ink)} .tone.p i{background:#E0874F}
.fb-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:680px){.fb-cols{grid-template-columns:minmax(0,1fr)}}
.col{border-radius:18px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.col.a{background:var(--teal-wash)}
.col.b{background:#FDF3EA}
.col h3{font-size:18px;display:flex;align-items:center;gap:8px}
.col h3 svg{width:22px;height:22px}
.col ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.col li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:baseline;font-size:16.5px}
.col li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--teal);transform:translateY(-1px)}
.col.b li::before{background:#E0874F}
.nextstep{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:center;background:var(--lilac-soft);border-radius:18px;padding:14px 18px}
.nextstep .ic{width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;border:2px solid var(--lilac)}
.nextstep .ic svg{width:24px;height:24px}
.nextstep b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--lilac-ink)}
.safety{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;background:var(--teal-wash);border:2px solid var(--teal);border-radius:18px;padding:14px 16px;font-weight:700}
.safety svg{width:30px;height:30px}
.caveat{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);border-top:1.5px dashed var(--line);padding-top:14px}
.caveat svg{width:20px;height:20px;flex:none;margin-top:2px}
.pathsum{display:grid;gap:8px;background:var(--sand);border-radius:18px;padding:16px 18px}
.pathsum div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;font-size:16px}
.pathsum span{font-weight:800;color:var(--ink-2);font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}

/* Ölçek */
.sv{display:grid;gap:18px;max-width:760px;margin-inline:auto;width:100%}
.sv-top{display:grid;gap:10px}
.sv-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;font-weight:800;color:var(--ink-2);font-size:15px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.item-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:24px;padding:clamp(18px,3vw,28px);display:grid;gap:18px}
.item-no{font:800 15px var(--f-display);color:var(--lilac-ink);letter-spacing:.04em}
.item-text{font:700 clamp(19px,2.4vw,23px)/1.4 var(--f-body);color:var(--ink)}
.likert{display:grid;gap:10px;margin:0;padding:0;border:0}
.likert legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lk{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--cream);font:700 17px/1.3 var(--f-body);color:var(--ink);cursor:pointer}
.lk:hover{border-color:var(--ink)}
.lk .r{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center}
.lk[aria-checked="true"]{border-color:var(--ink);background:var(--lilac-soft)}
.lk[aria-checked="true"] .r::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--ink)}
.yonerge{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:18px 20px;font-size:18px;font-weight:600}
.yonerge small{display:block;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.rv{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.rv li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 12px}

.rv .t .ans{color:var(--teal-ink);font-weight:800}
.rv .t .none{color:var(--peach-ink);font-weight:800}

.scale-card.off{border-style:dashed;box-shadow:none;background:transparent}
.scale-card .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
details.rnote{border-radius:14px;background:var(--sand);padding:10px 14px;font-size:14.5px}
details.rnote summary{cursor:pointer;font-weight:800;color:var(--ink-2)}
details.rnote ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}

/* Tamamlama */
.done-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.done-head svg.badge{width:clamp(120px,18vw,170px);height:auto}
@media (max-width:620px){.done-head{grid-template-columns:minmax(0,1fr);justify-items:start}}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.take p{font-weight:700;font-size:16.5px}
.donelist{display:grid;gap:8px;list-style:none;margin:0;padding:0}

.donelist li svg{width:22px;height:22px;color:var(--teal-ink)}
.donelist li.no svg{color:var(--ink-3)}
.donelist li small{color:var(--ink-3);font-weight:700}
.adults{display:flex;flex-wrap:wrap;gap:8px}
.adults span{background:var(--teal-soft);color:var(--teal-ink);font-weight:800;padding:8px 14px;border-radius:999px;font-size:15px}

.foot{max-width:1080px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 14px}

  function modulBitir(n) {

  function senaryoSec(sid, did, k) {
    var st = S.senaryo[sid], d = SC[sid].d[did], o = d.secenekler.filter(function (x) { return x.k === k; })[0];
    if (!o || mevcutDugum(sid) !== did) return;
    st.yol.push({ dugum: did, secim: k, hedef: o.hedef }); st.sira += 1; kaydet();

  function senaryoGeri(sid) {

  function senaryoBitir(sid) {
    var st = S.senaryo[sid], d = mevcutDugum(sid);

    if (!st.tamam) { st.tamam = true; st.zaman = simdi(); }

    git("modul_5_senaryolar");
  }
  function senaryoAc(sid) {
    var st = S.senaryo[sid];
    if (st.tamam || (st.yol.length && SC[sid].d[mevcutDugum(sid)].tip === "sonuc" && st.sonuc)) { st.deneme += 1; st.yol = []; st.sira = 0; kaydet(); }

  }

  /* ───────── Demo menüsü (yalnızca demo modunda oluşturulur) ───────── */
  function yolBul(sid, hedef) {
    var sc = SC[sid], q = [[sc.baslangic, []]], seen = {};
    while (q.length) {
      var x = q.shift(), id = x[0]; if (id === hedef) return x[1]; if (seen[id]) continue; seen[id] = 1;
      var d = sc.d[id]; (d.secenekler || []).forEach(function (o) { q.push([o.hedef, x[1].concat([{ dugum: id, secim: o.k, hedef: o.hedef }])]); });
    }
    return [];
  }
  function demoHazirla(r) {
    if (!DEMO) return;
    var c = coz(r), atla = false;
    function on() { planDoldurulabilir("on").forEach(function (id) { var k = kaydiHazirla("on", id); if (!k.tamam) { k.tamam = true; k.tamamZamani = simdi(); k.demoAtlama = true; atla = true; } }); }
    function modsUntil(n) { for (var i = 0; i < n; i++) { var st = S.modul[MODS[i].id]; if (!st.tamam) { st.tamam = true; st.zaman = simdi(); st.demoAtlama = true; atla = true; } } }
    if (c.t !== "karsilama" && c.t !== "giris") { if (!S.kod) { S.kod = A.demo.ornekKod; S.girisZamani = simdi(); } }
    if (c.t === "olcek" || c.t === "olcum") {
      if (c.m === "son") { on(); modsUntil(5); }
      if (c.t === "olcek" && (c.a === "gozden" || c.a === "bitti")) { var k = kaydiHazirla(c.m, c.id); if (c.a === "bitti" && !k.tamam) { k.tamam = true; k.tamamZamani = simdi(); k.demoAtlama = true; atla = true; } }
      if (c.t === "olcek" && c.a !== "bitti") { var kk = kaydiHazirla(c.m, c.id); if (kk.tamam) { kk.tamam = false; } }
    }
    if (c.t === "harita") on();
    if (c.t === "modul") { on(); modsUntil(c.n - 1); if (c.a === "ozet") modsUntil(c.n); }
    if (c.t === "senaryo") { on(); modsUntil(4); S.senaryo[c.id].yol = yolBul(c.id, c.d); S.senaryo[c.id].sira = S.senaryo[c.id].yol.length; }
    if (c.t === "tamam") {
      on(); modsUntil(4);
      SCN.forEach(function (s) { var st = S.senaryo[s.id]; if (!st.tamam) { st.tamam = true; st.zaman = simdi(); st.demoAtlama = true; atla = true; } });
      modsUntil(5);
      planDoldurulabilir("son").forEach(function (id) { var k = kaydiHazirla("son", id); if (!k.tamam) { k.tamam = true; k.tamamZamani = simdi(); k.demoAtlama = true; atla = true; } });
    }
    if (atla) S.demoAtlama = true;
  }
  var sifirlaSor = false;
  function jump(r, label, sub, dot) {
    return '<button class="jump' + (S.rota === r ? " cur" : "") + '" data-demo-go="' + r + '"><i class="' + (dot || "") + '"></i><span>' + esc(label) + (sub ? "<small>" + esc(sub) + "</small>" : "") + "</span></button>";
  }
  function menuKur() {
    var b = document.getElementById("sheet-body"); if (!b) return;
    var olc = function (m, ad) {
      return planOlcekleri(m).map(function (id, i) {
        var o = O[id];
        if (!doldurulabilir(id)) return '<p class="muted small">' + esc(ad) + " · Bölüm " + (i + 1) + " (" + esc(o.kisaAd) + "): form bekleniyor</p>";
        return jump("olcek_" + m + "_" + id + "_yonerge", ad + " · " + o.kisaAd + " yönerge") + jump("olcek_" + m + "_" + id + "_1", ad + " · " + o.kisaAd + " ifade kartı", "1. ifade") + jump("olcek_" + m + "_" + id + "_gozden", ad + " · " + o.kisaAd + " gözden geçirme") + jump("olcek_" + m + "_" + id + "_bitti", ad + " · " + o.kisaAd + " bölüm sonu");
      }).join("");
    };
    var mods = MODS.map(function (m) {
      var s = m.kartlar.map(function (k, i) { return jump("modul_" + m.no + "_kart_" + (i + 1), "Kart " + (i + 1), k.baslik); }).join("");

      s += jump("modul_" + m.no + "_ozet", "Modül özeti");
      return "<details><summary>Modül " + m.no + ": " + esc(m.ad) + "</summary>" + s + "</details>";
    }).join("");
    var scs = SCN.map(function (sc) {
      var kar = Object.keys(sc.d).filter(function (k) { return sc.d[k].tip === "karar"; }).map(function (k) { var d = sc.d[k]; return jump("senaryo_" + sc.id + "_" + k, "Karar " + d.adim + " · " + d.baslik); }).join("");
      var son = Object.keys(sc.d).filter(function (k) { return sc.d[k].tip === "sonuc"; }).map(function (k) { var d = sc.d[k]; var y = yolBul(sc.id, k).map(function (x) { return x.secim; }).join(" → "); return jump("senaryo_" + sc.id + "_" + k, y + " · " + d.etiket, null, d.ton); }).join("");
      return "<details><summary>" + esc(sc.ad) + "</summary>" + kar + son + "</details>";
    }).join("");
    b.innerHTML = '<div class="sheet-head"><div><h2 id="sheet-title">Demo görünümü</h2><p>Ekran görüntüsü için ekranlara doğrudan geç. Bu menü yalnızca demo sürümünde vardır; araştırma sürümünde bulunmaz.</p></div>' +
      '<button class="x" type="button" data-act="menu-kapat" aria-label="Menüyü kapat">' + I.close + "</button></div>" +
      '<div class="grp"><h3>Akış</h3>' + jump("karsilama", "Karşılama") + jump("giris", "Örnek kodla giriş") + jump("olcum_on", "Başlangıç değerlendirmesi") + olc("on", "Başlangıç") + jump("harita", "Öğrenme haritası") + "</div>" +
      '<div class="grp"><h3>Modüller</h3>' + mods + "</div>" +
      '<div class="grp"><h3>Senaryolar · karar ve sonuçlar</h3>' + scs + "</div>" +
      '<div class="grp"><h3>Bitiş</h3>' + jump("olcum_son", "Son değerlendirme") + olc("son", "Son") + jump("tamam", "Tamamlama ekranı") + "</div>" +
      '<div class="grp tools"><h3>Araçlar</h3>' +
      '<label class="toggle"><input type="checkbox" id="shotToggle"' + (S.shot ? " checked" : "") + ">Ekran görüntüsü modu: demo düğmesini gizle</label>" +
      '<p class="small muted">Bu modda menüyü sağ alttaki küçük noktadan ya da Esc tuşuyla yeniden açabilirsin. Menüden atlanan adımlar “demo atlaması” olarak işaretlenir.</p>' +
      (sifirlaSor ? '<div class="reset"><p><b>Tüm demo ilerlemesi silinsin mi?</b> Giriş, değerlendirme yanıtları, modüller ve senaryo seçimleri bu tarayıcıdan kaldırılır.</p><div class="row"><button class="sbtn danger" type="button" data-act="sifirla-evet">Evet, sıfırla</button><button class="sbtn" type="button" data-act="sifirla-hayir">Vazgeç</button></div></div>'
        : '<button class="sbtn" type="button" data-act="sifirla-sor">Demoyu sıfırla</button>') + "</div>";
  }
  var sonOdak = null;
  function menuAc() { if (!DEMO) return; sonOdak = document.activeElement; sifirlaSor = false; menuKur(); document.getElementById("sheet").hidden = false; var x = document.querySelector("#sheet .x"); if (x) x.focus(); }
  function menuKapat() { var s = document.getElementById("sheet"); if (!s) return; s.hidden = true; sifirlaSor = false; if (sonOdak && sonOdak.focus) { try { sonOdak.focus({ preventScroll: true }); } catch (e) {} } }

  /* ───────── Olay dinleyicileri ───────── */
  document.addEventListener("click", function (e) {
    var t;
    if ((t = e.target.closest("[data-yanit]"))) {
      var p = t.getAttribute("data-olcek").split("|"), m = p[0], id = p[1], n = +p[2], v = +t.getAttribute("data-yanit");

      var meta = app.querySelector(".sv-meta span:last-child"); if (meta) meta.textContent = Object.keys(k.yanitlar).length + " yanıtlandı";
      /* Otomatik ilerleme: son ifade ve gözden geçirme dönüşü hariç. */
      if (!gozdenDon && n < O[id].maddeler.length) {
        var red = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        clearTimeout(window.__ileri); window.__ileri = setTimeout(function () { if (S.rota === "olcek_" + m + "_" + id + "_" + n) git("olcek_" + m + "_" + id + "_" + (n + 1)); }, red ? 0 : 320);
      }

    }
    if ((t = e.target.closest("[data-sec]"))) {
      var q = t.getAttribute("data-sec").split("|");
      t.classList.add("picked"); app.querySelectorAll(".choice").forEach(function (c) { c.disabled = true; });
      var red2 = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      setTimeout(function () { senaryoSec(q[0], q[1], q[2]); }, red2 ? 0 : 240);

    }
    if ((t = e.target.closest("[data-etk]"))) {
      var a = t.getAttribute("data-etk").split("|"), mm = MODS[+a[0] - 1], st = S.modul[mm.id].etkinlik;
      st[a[1]] = st[a[1]] || {}; st[a[1]][a[2]] = a[3]; kaydet(); ciz(true); return;

      var d2 = s2[c2[1]] = s2[c2[1]] || { secili: [] }; d2.secili = d2.secili || []; var ix = +c2[2], pos = d2.secili.indexOf(ix);
      if (pos >= 0) d2.secili.splice(pos, 1); else d2.secili.push(ix); kaydet(); ciz(true); return;
    }
    if ((t = e.target.closest("[data-cevir]"))) {
      var c3 = t.getAttribute("data-cevir").split("|"), m3 = MODS[+c3[0] - 1], s3 = S.modul[m3.id].etkinlik;
      s3[c3[1]] = s3[c3[1]] || {}; s3[c3[1]][c3[2]] = !s3[c3[1]][c3[2]] || true; kaydet(); ciz(true); return;
    }
    if ((t = e.target.closest("[data-plan]"))) { var pi = +t.getAttribute("data-plan"); planSecim[pi] = !planSecim[pi]; ciz(true); return; }
    if ((t = e.target.closest("[data-demo-go]"))) { var r = t.getAttribute("data-demo-go"); menuKapat(); demoHazirla(r); gozdenDon = false; gonderOnay = false; if (r === "giris") { girisHata = ""; girisDeger = ""; } git(r); return; }

    else if (act === "senaryo-geri") senaryoGeri(t.getAttribute("data-id"));

    else if (act === "cikis-vazgec") { cikisSor = false; ciz(true); }

  });
  /* Radyo grubu için ok tuşları */

  document.addEventListener("submit", function (e) {
    if (e.target.id !== "loginForm") return;

  (function kabuk() {

        '<div class="sheet-wrap" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-body"></div></div>');
